<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Otome Game</title>
  <style>
    body, html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: black;
    }

    #game-container {
      position: relative;
      width: 100%;
      height: 100%;
    }

    .scene {
      position: absolute;
      width: 100%;
      height: 100%;
      background-size: contain;
      background-repeat: no-repeat;
      background-position: center;
      display: none;
    }

    #start-screen {
      display: block;
      background: url('start.jpg') no-repeat center center;
      background-size: contain;
    }

    #start-button {
      position: absolute;
      left: 50%;
      top: 78%;
      transform: translate(-50%, -50%);
      width: 200px;
      height: 70px;
      background: transparent;
      border: none;
      cursor: pointer;
    }

    .subtitle {
      position: absolute;
      bottom: 40px;
      width: 100%;
      text-align: center;
      font-size: 24px;
      color: #FFD633; /* brighter ochre yellow */
      font-family: 'Georgia', serif;
      text-shadow: 2px 2px 4px black;
    }

    canvas {
      position: absolute;
      top: 0;
      left: 0;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <div id="game-container">
    <!-- Start screen -->
    <div id="start-screen" class="scene">
      <button id="start-button"></button>
      <canvas id="petals-canvas"></canvas>
    </div>

    <!-- 5 story scenes -->
    <div id="scene1" class="scene" style="background-image: url('scene1.jpg');"></div>
    <div id="scene2" class="scene" style="background-image: url('scene2.jpg');"></div>
    <div id="scene3" class="scene" style="background-image: url('scene3.jpg');"></div>
    <div id="scene4" class="scene" style="background-image: url('scene4.jpg');"></div>
    <div id="scene5" class="scene" style="background-image: url('scene5.jpg');"></div>

    <!-- Subtitles -->
    <div id="subtitle" class="subtitle"></div>
  </div>

  <audio id="start-music" src="music.mp3" loop></audio>
  <audio id="epilogue-music" src="epilogue.mp3" loop></audio>

  <script>
    const startButton = document.getElementById("start-button");
    const startScreen = document.getElementById("start-screen");
    const subtitle = document.getElementById("subtitle");
    const scenes = [
      { id: "scene1", text: "It was a quiet evening, when their story began." },
      { id: "scene2", text: "The city lights reflected their unspoken feelings." },
      { id: "scene3", text: "Each moment together felt timeless and fragile." },
      { id: "scene4", text: "He reached out, and she understood without words." },
      { id: "scene5", text: "And so, under the stars, their journey truly started." }
    ];

    let currentScene = 0;

    const startMusic = document.getElementById("start-music");
    const epilogueMusic = document.getElementById("epilogue-music");

    // Play music.mp3 on load
    window.onload = () => {
      startMusic.play().catch(err => console.log("Autoplay blocked:", err));
    };

    startButton.addEventListener("click", () => {
      // Stop start music, start epilogue
      startMusic.pause();
      startMusic.currentTime = 0;
      epilogueMusic.play();

      startScreen.style.display = "none";
      showScene(currentScene);
    });

    function showScene(index) {
      if (index >= scenes.length) return;

      const scene = document.getElementById(scenes[index].id);
      scene.style.display = "block";
      typeSubtitle(scenes[index].text, () => {
        setTimeout(() => {
          scene.style.display = "none";
          currentScene++;
          showScene(currentScene);
        }, 3000);
      });
    }

    function typeSubtitle(text, callback) {
      subtitle.innerHTML = "";
      let i = 0;
      function typing() {
        if (i < text.length) {
          subtitle.innerHTML += text.charAt(i);
          i++;
          setTimeout(typing, 50);
        } else if (callback) {
          callback();
        }
      }
      typing();
    }

    // Petals only on start screen
    const canvas = document.getElementById("petals-canvas");
    const ctx = canvas.getContext("2d");
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;

    let petals = [];
    const petalImage = new Image();
    petalImage.src = "petal.png";

    class Petal {
      constructor() {
        this.x = Math.random() * canvas.width;
        this.y = Math.random() * -canvas.height;
        this.size = 20 + Math.random() * 15;
        this.speed = 1 + Math.random() * 2;
        this.drift = Math.random() * 2 - 1;
      }
      update() {
        this.y += this.speed;
        this.x += this.drift;
        if (this.y > canvas.height) {
          this.y = -this.size;
          this.x = Math.random() * canvas.width;
        }
      }
      draw() {
        ctx.drawImage(petalImage, this.x, this.y, this.size, this.size);
      }
    }

    function createPetals() {
      for (let i = 0; i < 20; i++) {
        petals.push(new Petal());
      }
    }

    function animatePetals() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      petals.forEach(petal => {
        petal.update();
        petal.draw();
      });
      requestAnimationFrame(animatePetals);
    }

    petalImage.onload = () => {
      createPetals();
      animatePetals();
    };
  </script>
</body>
</html>
