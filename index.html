<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Otome Game</title>
  <style>
    body, html {
      margin: 0;
      padding: 0;
      height: 100%;
      width: 100%;
      overflow: hidden;
      background: black;
      font-family: Arial, sans-serif;
    }

    /* Background images */
    #background {
      position: fixed;
      top: 0;
      left: 0;
      height: 100%;
      width: 100%;
      background-size: contain;
      background-repeat: no-repeat;
      background-position: center;
      opacity: 0;
      transition: opacity 1s ease-in-out;
    }

    /* Start Screen */
    #start-screen {
      position: absolute;
      top: 0;
      left: 0;
      height: 100%;
      width: 100%;
      background: url('start.jpg') center center / cover no-repeat;
      display: flex;
      justify-content: center;
      align-items: center;
      flex-direction: column;
      z-index: 2;
    }

    #start-button {
      padding: 15px 40px;
      font-size: 24px;
      background-color: #CC9A06;
      border: none;
      color: black;
      cursor: pointer;
      font-weight: bold;
      border-radius: 8px;
      transition: transform 0.2s;
    }

    #start-button:hover {
      transform: scale(1.05);
    }

    /* Subtitle Text */
    #subtitle {
      position: absolute;
      bottom: 60px;
      width: 100%;
      text-align: center;
      font-size: 24px;
      color: #CC9A06;
      text-shadow: 2px 2px 6px black;
      padding: 0 20px;
      box-sizing: border-box;
      min-height: 50px;
    }

    /* Petals */
    .petal {
      position: absolute;
      top: -10px;
      background: url('petal.png') no-repeat center center / contain;
      width: 25px;
      height: 25px;
      opacity: 0.8;
      animation: fall linear forwards;
    }

    @keyframes fall {
      to {
        transform: translateY(110vh) rotate(360deg);
      }
    }
  </style>
</head>
<body>

  <!-- Background -->
  <div id="background"></div>

  <!-- Start Screen -->
  <div id="start-screen">
    <button id="start-button">Start</button>
  </div>

  <!-- Subtitle -->
  <div id="subtitle"></div>

  <!-- Music -->
  <audio id="start-music" src="music.mp3" loop></audio>
  <audio id="epilogue-music" src="epilogue.mp3" loop></audio>

  <script>
    const startScreen = document.getElementById("start-screen");
    const startButton = document.getElementById("start-button");
    const background = document.getElementById("background");
    const subtitle = document.getElementById("subtitle");
    const startMusic = document.getElementById("start-music");
    const epilogueMusic = document.getElementById("epilogue-music");

    // Scenes
    const scenes = [
      {
        image: "e1.jpg",
        text: [
          "Damn. I haven't checked my phone all day. It was a long day at the library.",
          "Hmm.. Syringe? This app has been so dry lately.",
          "I should just delete it at this point. I don't think I want to hear another corny voice note.",
          "*swipe* *swipe* *swipe*"
        ]
      },
      {
        image: "e2.jpg",
        text: [
          "Oooooh look at this. Seems interesting.",
          "She likes metal huh? Looks like my talents are gonna come in handy again.",
          "I don't expect anything though. I'm tired of even sending comments, but let me do this last one for today.",
          "“I play metal.\" Sent."
        ]
      },
      {
        image: "e3.jpg",
        text: [
          "Oh my god. I think I studied too much today.",
          "It does get stressful sometimes.",
          "Mmmmm… I feel kinda sleepy now...",
          "zzzzz"
        ]
      },
      {
        image: "e4.jpg",
        text: [
          "*phone beeps* \"You matched with Kriti.\"",
          "Mmmmm.. Oh god, did I fall asleep?",
          "What time is it…? Let me just get into bed."
        ]
      },
      {
        image: "e5.jpg",
        text: [
          "Okay let's see. Looks like I matched with this girl.",
          "Ummm… let me drop her a text.",
          "*a few hours into the conversation*",
          "She seems cool... wouldn't hurt to meet up I guess."
        ]
      }
    ];

    let currentScene = 0;
    let currentLine = 0;
    let isTyping = false;

    // Petal animation
    function createPetal() {
      const petal = document.createElement("div");
      petal.classList.add("petal");
      petal.style.left = Math.random() * window.innerWidth + "px";
      petal.style.animationDuration = (5 + Math.random() * 5) + "s";
      document.body.appendChild(petal);

      setTimeout(() => {
        petal.remove();
      }, 10000);
    }

    let petalInterval = setInterval(createPetal, 400);

    // Start Button
    startButton.addEventListener("click", () => {
      startScreen.style.display = "none";
      clearInterval(petalInterval); // stop petals once game starts
      startMusic.pause();
      epilogueMusic.play();
      showScene();
    });

    function showScene() {
      currentLine = 0;
      background.style.backgroundImage = `url(${scenes[currentScene].image})`;
      background.style.opacity = 1;
      showLine();
    }

    function showLine() {
      isTyping = true;
      subtitle.textContent = "";
      const line = scenes[currentScene].text[currentLine];
      let i = 0;
      const typing = setInterval(() => {
        subtitle.textContent += line[i];
        i++;
        if (i >= line.length) {
          clearInterval(typing);
          isTyping = false;
        }
      }, 40); // typing speed
    }

    document.body.addEventListener("click", () => {
      if (startScreen.style.display !== "none") return; // disable clicks on start screen
      if (isTyping) return; // ignore clicks while typing

      currentLine++;
      if (currentLine < scenes[currentScene].text.length) {
        showLine();
      } else {
        currentScene++;
        if (currentScene < scenes.length) {
          showScene();
        } else {
          subtitle.textContent = "The End";
        }
      }
    });
  </script>
</body>
</html>
