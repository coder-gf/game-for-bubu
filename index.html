<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Otome Visual Novel</title>
  <style>
    body, html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    #gameContainer {
      position: relative;
      width: 100%;
      height: 100%;
      background: black;
    }

    #background {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover; /* fills screen fully, crops edges if needed */
      background-color: black;
    }

    #subtitleBox {
      position: absolute;
      bottom: 10%;
      width: 100%;
      text-align: center;
      font-size: 2vw;
      color: #FFD84D; /* brighter ochre yellow */
      text-shadow: 2px 2px 4px black;
    }

    #startOverlay {
      position: absolute;
      bottom: 12%;
      left: 50%;
      transform: translateX(-50%);
      width: 200px;   /* adjust to match your drawn button */
      height: 60px;   /* adjust to match your drawn button */
      cursor: pointer;
      background: transparent;
      border: none;
    }

    /* Petal animation */
    .petal {
      position: absolute;
      top: -50px;
      width: 25px;
      height: 25px;
      background-image: url('petal.png'); /* replace with your petal image */
      background-size: contain;
      background-repeat: no-repeat;
      animation: fall linear infinite;
    }

    @keyframes fall {
      0% { transform: translateY(0) rotate(0deg); }
      100% { transform: translateY(110vh) rotate(360deg); }
    }
  </style>
</head>
<body>
  <div id="gameContainer">
    <img id="background" src="start.jpg">
    <div id="subtitleBox"></div>
    <button id="startOverlay"></button>
    <audio id="bgm" src="music.mp3" loop></audio>
  </div>

  <script>
    const background = document.getElementById("background");
    const subtitleBox = document.getElementById("subtitleBox");
    const startOverlay = document.getElementById("startOverlay");
    const bgm = document.getElementById("bgm");

    // Scenes
    const scenes = [
      {
        img: "e1.jpg",
        lines: [
          "Damn. I haven't checked my phone all day. It was a long day at the library.",
          "Hmm.. Syringe? This app has been so dry lately.",
          "I should just delete it at this point. I don't think I want to hear another corny voice note.",
          "*swipe* *swipe* *swipe*"
        ]
      },
      {
        img: "e2.jpg",
        lines: [
          "Oooooh look at this. Seems interesting.",
          "She likes metal huh? Looks like my talents are gonna come in handy again.",
          "I don't expect anything though. I'm tired of even sending comments, but let me do this last one for today.",
          "“I play metal.\" Sent."
        ]
      },
      {
        img: "e3.jpg",
        lines: [
          "Oh my god. I think I studied too much today.",
          "It does get stressful sometimes.",
          "Mmmmm… I feel kinda sleepy now...",
          "zzzzz"
        ]
      },
      {
        img: "e4.jpg",
        lines: [
          "*phone beeps* \"You matched with Kriti.\"",
          "Mmmmm.. Oh god, did I fall asleep?",
          "What time is it…? Let me just get into bed."
        ]
      },
      {
        img: "e5.jpg",
        lines: [
          "Okay let's see. Looks like I matched with this girl.",
          "Ummm… let me drop her a text.",
          "*a few hours into the conversation*",
          "She seems cool... wouldn't hurt to meet up I guess."
        ]
      }
    ];

    let currentScene = 0;
    let currentLine = 0;
    let typing = false;

    // Petal spawning only for start screen
    function createPetals() {
      const petal = document.createElement("div");
      petal.classList.add("petal");
      petal.style.left = Math.random() * window.innerWidth + "px";
      petal.style.animationDuration = 5 + Math.random() * 5 + "s";
      document.getElementById("gameContainer").appendChild(petal);

      setTimeout(() => petal.remove(), 10000);
    }

    let petalInterval = setInterval(createPetals, 500);

    // Typing effect for subtitles
    function typeLine(line, callback) {
      typing = true;
      subtitleBox.innerHTML = "";
      let i = 0;
      const interval = setInterval(() => {
        subtitleBox.innerHTML += line.charAt(i);
        i++;
        if (i >= line.length) {
          clearInterval(interval);
          typing = false;
          if (callback) callback();
        }
      }, 50);
    }

    // Show next line or scene
    function next() {
      if (typing) return;
      if (currentLine < scenes[currentScene].lines.length) {
        typeLine(scenes[currentScene].lines[currentLine], () => {
          currentLine++;
        });
      } else {
        currentScene++;
        currentLine = 0;
        if (currentScene < scenes.length) {
          background.src = scenes[currentScene].img;
          next();
        } else {
          subtitleBox.innerHTML = "The End";
        }
      }
    }

    // Start game
    startOverlay.addEventListener("click", () => {
      clearInterval(petalInterval); // stop petals
      document.querySelectorAll(".petal").forEach(p => p.remove()); // clear existing petals
      background.src = scenes[0].img;
      startOverlay.style.display = "none";
      bgm.play();
      next();
    });

    // Advance on click
    document.getElementById("gameContainer").addEventListener("click", () => {
      if (startOverlay.style.display === "none") {
        next();
      }
    });
  </script>
</body>
</html>
