<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Otome Game Start</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    html, body {
      margin: 0;
      padding: 0;
      background-color: black;
      overflow: hidden;
    }

    .game-container {
      width: 100vw;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
    }

    .start-bg {
      width: 100%;
      height: 100%;
      background-image: url('start.jpg');
      background-size: contain;
      background-repeat: no-repeat;
      background-position: center;
      position: absolute;
      z-index: 1;
    }

    .click-area {
      position: absolute;
      left: 25%;
      bottom: 10%;
      width: 50%;
      height: 12%;
      z-index: 3;
      cursor: pointer;
    }

    .petal {
      position: absolute;
      width: 30px;
      height: 30px;
      background-image: url('petal.png');
      background-size: contain;
      background-repeat: no-repeat;
      animation: fall linear infinite;
      z-index: 2;
    }

    @keyframes fall {
      0% {
        transform: translateY(-10vh) rotate(0deg);
        opacity: 1;
      }
      100% {
        transform: translateY(110vh) rotate(360deg);
        opacity: 0;
      }
    }
  </style>
</head>
<body>
  <div class="game-container">
    <div class="start-bg"></div>

    <!-- Updated clickable area aligned to drawn start button -->
    <div class="click-area" onclick="startGame()"></div>
  </div>

  <audio id="bg-music" src="music.mp3" loop></audio>

  <script>
    const music = document.getElementById("bg-music");

    // Safari won't autoplay without interaction
    window.addEventListener("click", () => {
      if (music.paused) music.play();
    });

    // Create falling petals
    function createPetals() {
      const container = document.querySelector('.game-container');
      for (let i = 0; i < 20; i++) {
        const petal = document.createElement("div");
        petal.className = "petal";
        petal.style.left = Math.random() * 100 + "vw";
        petal.style.animationDuration = 5 + Math.random() * 5 + "s";
        petal.style.animationDelay = Math.random() * 5 + "s";
        container.appendChild(petal);
      }
    }

    createPetals();

    function startGame() {
      alert("Start game! (This will change to actual scene transition soon)");
      // Later: window.location.href = 'scene1.html';
    }
  </script>
</body>
</html>
