<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Otome Game Start</title>
  <style>
    body, html {
      margin: 0;
      padding: 0;
      height: 100%;
      width: 100%;
      overflow: hidden;
    }

    #game-container {
      position: relative;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    .start-bg {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: contain; /* ensures no cropping */
      z-index: 0;
    }

    #start-button {
      position: absolute;
      bottom: 20%; /* adjust to match drawn button */
      left: 50%;
      transform: translateX(-50%);
      width: 180px;
      height: 70px;
      background: transparent;
      border: none;
      cursor: pointer;
      z-index: 2;
    }

    #petals-canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 1;
    }

    #game-screen {
      display: none;
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: white;
      z-index: 3;
      padding: 20px;
      box-sizing: border-box;
    }
  </style>
</head>
<body>
  <div id="game-container">
    <img src="start.jpg" class="start-bg" alt="Start screen">
    <canvas id="petals-canvas"></canvas>
    <button id="start-button"></button>
    <div id="game-screen">
      <h1>Chapter 1</h1>
      <p>The story begins...</p>
    </div>
  </div>

  <audio id="bg-music" src="music.mp3" loop></audio>

  <script>
    const canvas = document.getElementById("petals-canvas");
    const ctx = canvas.getContext("2d");
    let petals = [];
    const petalImage = new Image();
    petalImage.src = "petal.png";

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }

    window.addEventListener("resize", resizeCanvas);
    resizeCanvas();

    class Petal {
      constructor() {
        this.reset();
      }

      reset() {
        this.x = Math.random() * canvas.width;  // random across screen
        this.y = -20; // start ABOVE the screen
        this.size = 25 + Math.random() * 25; // larger petals
        this.speed = 1 + Math.random() * 2;
        this.angle = Math.random() * Math.PI * 2;
        this.swing = Math.random() * 50;
      }

      update() {
        this.y += this.speed;
        this.x += Math.sin(this.angle) * 0.5;
        this.angle += 0.01;

        if (this.y > canvas.height) {
          this.reset(); // restart at top
        }
      }

      draw() {
        ctx.drawImage(petalImage, this.x, this.y, this.size, this.size);
      }
    }

    function createPetals() {
      petals = [];
      for (let i = 0; i < 30; i++) {
        petals.push(new Petal());
      }
    }

    function animate() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      for (let petal of petals) {
        petal.update();
        petal.draw();
      }
      requestAnimationFrame(animate);
    }

    petalImage.onload = () => {
      createPetals();
      animate();
    };

    // Start button functionality
    const startButton = document.getElementById("start-button");
    const gameScreen = document.getElementById("game-screen");
    const bgMusic = document.getElementById("bg-music");

    startButton.addEventListener("click", () => {
      document.querySelector(".start-bg").style.display = "none";
      startButton.style.display = "none";
      document.getElementById("petals-canvas").style.display = "none";
      gameScreen.style.display = "block";
      bgMusic.play();
    });
  </script>
</body>
</html>
