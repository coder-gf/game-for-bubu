<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Visual Novel – First Date</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- Start Screen -->
  <div id="start-screen" class="stage visible">
    <img class="bg" src="start.jpg" alt="Start" />

    <!-- Falling petals live only on start screen -->
    <div id="petals-layer" aria-hidden="true"></div>

    <!-- Invisible clickable area placed over the grey "start" button -->
    <button id="start-button" aria-label="Start"></button>

    <!-- Start-screen music -->
    <audio id="start-music" src="music.mp3" preload="auto" loop></audio>
  </div>

  <!-- Epilogue Stage (e1 → e10) -->
  <div id="epilogue" class="stage">
    <img id="scene-image" class="bg fade" alt="Scene" />
    <!-- Subtitles (no background box) -->
    <div id="subtitle" role="dialog" aria-live="polite"></div>
    
    <!-- Epilogue music -->
    <audio id="epilogue-music" src="epilogue.mp3" preload="auto" loop></audio>
  </div>

  <!-- First Date Stage -->
  <div id="first-date" class="stage">
    <img class="bg" src="bg1.jpg" alt="First Date Background" />
    
    <div id="dialogue-container">
      <img id="dialogue-box" src="d1.png" alt="Dialogue Box" />
      <div id="date-dialogue"></div>
      <button id="next-button" aria-label="Next"></button>
    </div>
    
    <!-- Date music -->
    <audio id="date-music" src="date_music.mp3" preload="auto" loop></audio>
  </div>

  <script src="script.js"></script>
</body>
</html>
